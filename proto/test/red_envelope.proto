syntax = "proto3";

// 目录 proto/test/ 对应的 app 是 app/test，生成到 genpb/test（package testpb）。
// 目录名和 go_package 必须对得上，不一致很难查。
option go_package = "go_pg_test/genpb/test;testpb";

import "ext.proto";

message CRedEnvelope {
  option (proto.type_id) = 123;

  int32 actId = 1;
}

message SRedEnvelope {
  option (proto.type_id) = 124;

  int32 actId = 1;
  int64 lastRefreshAt = 2;
  int32 todayCount = 3;
  int32 total = 4;
}

message CRedEnvelopeClick {
  option (proto.type_id) = 125;

  int32 actId = 1;
}
