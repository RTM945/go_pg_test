syntax = "proto3";

// 目录 proto/test/ 对应的 app 是 app/test，生成到 genpb/test（package testpb）。
// 目录名和 go_package 必须对得上，不一致很难查。
option go_package = "go_pg_test/genpb/test;testpb";

import "ext.proto";

message Login {
  option (proto.type_id) = 101;

  string plat = 1;
  string account = 2;
  // ext 里有免登录用的 refreshToken（key 1）
  map<int32, string> ext = 3;
  string clientVersion = 4;
}

message LoginResult {
  option (proto.type_id) = 102;

  int64 uid = 1;
  string name = 2;
  // 轮换后的免登录凭证；loginToken 和 requestToken 走响应头：
  //   X-Login-Token / X-Request-Token
  string refreshToken = 3;
}